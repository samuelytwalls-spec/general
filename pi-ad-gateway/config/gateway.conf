# Pi Ad-Blocking Gateway settings. Edit, then run: sudo ./install.sh

# --- New network the Pi broadcasts ---
AP_SSID="PiShield"
AP_PASSPHRASE="change-me-please"   # 8-63 characters, must differ from your router's
AP_CHANNEL=6
COUNTRY_CODE="US"                  # your 2-letter country code (required for legal wifi)

# --- Interfaces ---
AP_IF="wlan0"                      # onboard wifi, becomes the access point
UPLINK_IF="eth0"                   # link to your router (ethernet recommended).
                                   # For wifi uplink, plug in a USB wifi adapter, join your
                                   # router with `nmtui`, and set this to wlan1.

# --- Gateway addressing (must not overlap your router's subnet) ---
GATEWAY_IP="192.168.50.1"
DHCP_START="192.168.50.20"
DHCP_END="192.168.50.200"
DHCP_LEASE="12h"

# --- Upstream DNS (what the Pi asks after filtering) ---
UPSTREAM_DNS_1="1.1.1.1"
UPSTREAM_DNS_2="9.9.9.9"

# --- Filtering ---
BLOCK_DOT="yes"                    # block DNS-over-TLS (port 853) so clients can't skip the filter
BLOCK_DOH="yes"                    # block well-known DNS-over-HTTPS resolver IPs
