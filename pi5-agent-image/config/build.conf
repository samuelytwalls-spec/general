# Build settings for ./build.sh  (bash syntax; sourced by the build script).
#
# Put private values (password, SSH key, Wi-Fi) in config/build.local.conf
# instead: it is read after this file and is ignored by git.

# --- Image ---------------------------------------------------------------------
# Output: deploy/<date>-<IMG_NAME>-piagent.img
IMG_NAME=raspios-bookworm-arm64-pi5
TARGET_HOSTNAME=piagent
FIRST_USER_NAME=pi
# Empty: a random password is generated, printed, and saved next to the image.
FIRST_USER_PASS=""
# Optional public key for SSH logins, e.g. "ssh-ed25519 AAAA... you@laptop"
PUBKEY_SSH_FIRST_USER=""
# 1 = disable SSH password logins (requires PUBKEY_SSH_FIRST_USER)
PUBKEY_ONLY_SSH=0
LOCALE_DEFAULT=en_US.UTF-8
KEYBOARD_KEYMAP=us
KEYBOARD_LAYOUT="English (US)"
TIMEZONE_DEFAULT=Etc/UTC
# Wi-Fi is optional (Ethernet works out of the box). WPA_COUNTRY is required
# for Wi-Fi, e.g. US, GB, DE.
WPA_COUNTRY=""
WIFI_SSID=""
WIFI_PSK=""
# none = plain .img (flash it directly); xz / zip / gz = compressed (Raspberry
# Pi Imager can flash .img.xz directly, and it is about 3x smaller).
DEPLOY_COMPRESSION=none
# 1 = Bluetooth off (dtoverlay=disable-bt, bluetooth/hciuart masked)
DISABLE_BLUETOOTH=1

# --- PiAgent ---------------------------------------------------------------------
PIAGENT_API_PORT=8443

# --- Pinned sources --------------------------------------------------------------
# pi-gen: the 64-bit Bookworm branch, at the tag of the matching Raspberry Pi
# OS release.
PIGEN_REPO=https://github.com/RPi-Distro/pi-gen
PIGEN_REF=2026-10-06-raspios-bookworm-arm64
PIGEN_COMMIT=47e27df5bd5d12d824764e6e6da2b619ba8e2501

LLAMA_CPP_REPO=https://github.com/ggml-org/llama.cpp
LLAMA_CPP_REF=b11559
LLAMA_CPP_COMMIT=f2cc7282ce0042641df55e0e563b75e824e2b647
# Raspberry Pi 5 = Cortex-A76 (ARMv8.2-A + dot product + FP16)
LLAMA_ARM_ARCH=armv8.2-a+dotprod+fp16

# --- Models --------------------------------------------------------------------------
# Phi-4-mini-instruct (3.8B), 4-bit Q4_K_M quantization, about 2.5 GB.
CHAT_MODEL_URL=https://huggingface.co/bartowski/microsoft_Phi-4-mini-instruct-GGUF/resolve/main/microsoft_Phi-4-mini-instruct-Q4_K_M.gguf
CHAT_MODEL_FILE=Phi-4-mini-instruct-Q4_K_M.gguf
# bge-small-en-v1.5 (33M parameters, 384-dim embeddings), 8-bit, about 36 MB.
EMBED_MODEL_URL=https://huggingface.co/CompendiumLabs/bge-small-en-v1.5-gguf/resolve/main/bge-small-en-v1.5-q8_0.gguf
EMBED_MODEL_FILE=bge-small-en-v1.5-q8_0.gguf
# Pin the model hashes for reproducible builds. When empty, the first download
# is trusted and its hash is recorded in cache/artifacts/models/SHA256SUMS and
# printed, so you can copy it here.
CHAT_MODEL_SHA256=""
EMBED_MODEL_SHA256=""
# Optional Hugging Face token (only needed for gated models).
HF_TOKEN="${HF_TOKEN:-}"

# --- Python wheels (installed offline in the image) -------------------------------
SQLITE_VEC_VERSION=0.1.9
SQLITE_VEC_SHA256=4e921e592f24a5f9a18f590b6ddd530eb637e2d474e3b1972f9bbeb773aa3cb9

# --- Build environment -------------------------------------------------------------
# Downloads and compiled binaries are cached here between builds.
CACHE_DIR=""
# Container used to cross-compile llama.cpp against Bookworm's glibc.
BUILDER_IMAGE=debian:bookworm
# Name of the pi-gen build container.
PIGEN_CONTAINER=piagent_pigen
# Extra `docker run` options, e.g. "--network host" when your HTTP(S) proxy
# listens on localhost. BUILDER_* is for the llama.cpp compile container,
# PIGEN_* for the pi-gen container.
BUILDER_DOCKER_OPTS="${BUILDER_DOCKER_OPTS:-}"
PIGEN_DOCKER_OPTS="${PIGEN_DOCKER_OPTS:-}"
